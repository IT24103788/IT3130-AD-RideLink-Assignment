# ============================================================================
# RideLink API Gateway — application.yml
# ============================================================================
#
# This file configures the Spring Cloud Gateway.
#
# ARCHITECTURE:
#
#   Postman / Swagger / Browser
#           |
#           v
#   +------------------+
#   |  API GATEWAY     |   <-- This application (port 8080)
#   |     :8080        |       Routes requests; NO business logic, NO MongoDB.
#   +------------------+
#    |      |      |      |
#    v      v      v      v
# :8081   :8082  :8083  :8084
# Account Driver  Ride  Fare &
# Service Service Mgmt  Payment
#
# HOW ROUTING WORKS:
#   1. Client sends a request to http://localhost:8080/<path>
#   2. The gateway checks each route's predicates (Path patterns) in order.
#   3. The FIRST route whose predicate matches wins.
#   4. The gateway forwards the full request (method, headers, body) to the
#      target service URI, keeping the original path intact.
#   5. The service response is returned to the client unchanged.
#
# ============================================================================

server:
  port: ${GATEWAY_PORT:8080}  # Default 8080; override with env var GATEWAY_PORT


spring:
  application:
    name: ridelink-api-gateway

  # --------------------------------------------------------------------------
  # Spring Cloud Gateway Route Configuration
  # --------------------------------------------------------------------------
  # Each route has:
  #   id        — unique identifier (used in logs and actuator endpoints)
  #   uri       — the downstream service to forward to
  #   predicates — conditions that must match for this route to be selected
  #
  # NOTE: Paths verified against actual controller @RequestMapping annotations
  # in the existing microservice source code before writing this config.
  # --------------------------------------------------------------------------
  cloud:
    gateway:
      routes:

        # ────────────────────────────────────────────────────────────────────
        # ROUTE 1: Account Service  →  http://localhost:8081
        # ────────────────────────────────────────────────────────────────────
        # Controllers inspected:
        #   AuthController  → @RequestMapping("/api/auth")
        #     POST /api/auth/register
        #     POST /api/auth/login
        #
        #   UserController  → @RequestMapping("/api/users")
        #     GET  /api/users/me
        #     PUT  /api/users/me
        #     PUT  /api/users/me/password
        #     GET  /api/users          (admin)
        #     GET  /api/users/{id}     (admin)
        #     PUT  /api/users/{id}/status  (admin)
        # ────────────────────────────────────────────────────────────────────
        - id: account-service-auth
          uri: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: account-service-users
          uri: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**

        # ────────────────────────────────────────────────────────────────────
        # ROUTE 2: Driver & Vehicle Service  →  http://localhost:8082
        # ────────────────────────────────────────────────────────────────────
        # Controllers inspected:
        #   DriverProfileController → @RequestMapping("/api/drivers")
        #     POST /api/drivers
        #
        # NOTE: At time of inspection there is only one controller with one
        # endpoint. No /api/vehicles/** controller was found in driver-service.
        # The wildcard /api/drivers/** is used so that any future endpoints
        # added under /api/drivers are automatically routed correctly.
        # ────────────────────────────────────────────────────────────────────
        - id: driver-service
          uri: ${DRIVER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/drivers/**

        - id: driver-service-vehicles
          uri: ${DRIVER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/vehicles/**

        # ────────────────────────────────────────────────────────────────────
        # ROUTE 3: Ride Management Service  →  http://localhost:8083
        # ────────────────────────────────────────────────────────────────────
        # Controllers inspected:
        #   RideController → @RequestMapping("/api/rides")
        #     POST /api/rides
        #     GET  /api/rides
        #     GET  /api/rides/{rideId}
        #     GET  /api/rides/passenger/{passengerId}
        #     GET  /api/rides/driver/{driverId}
        #     PUT  /api/rides/{rideId}/assign-driver
        #     PUT  /api/rides/{rideId}/status
        #     PUT  /api/rides/{rideId}/cancel
        # ────────────────────────────────────────────────────────────────────
        - id: ride-service
          uri: ${RIDE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/rides/**

        # ────────────────────────────────────────────────────────────────────
        # ROUTE 4: Fare & Payment Service  →  http://localhost:8084
        # ────────────────────────────────────────────────────────────────────
        # Controllers inspected:
        #   FareController → @RequestMapping("/api/fares")
        #     POST /api/fares/estimate
        #       Body: { "rideId": "...", "distanceKm": 5.0, "durationMinutes": 15.0 }
        #
        # NOTE: No /api/payments/** controller was found at inspection time.
        # /api/payments/** is included here so it is ready when that controller
        # is implemented, and the gateway does not need to be changed.
        # ────────────────────────────────────────────────────────────────────
        - id: fare-payment-service-fares
          uri: ${FARE_PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/fares/**

        - id: fare-payment-service-payments
          uri: ${FARE_PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/payments/**

      # ──────────────────────────────────────────────────────────────────────
      # Global CORS Configuration
      # ──────────────────────────────────────────────────────────────────────
      # This allows Swagger UI running in a browser tab (on any localhost port)
      # to make requests through the gateway without CORS errors.
      # Suitable for LOCAL DEVELOPMENT ONLY.
      # Do not use allowedOrigins: "*" in a production environment.
      # ──────────────────────────────────────────────────────────────────────
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:8080"
              - "http://localhost:8081"
              - "http://localhost:8082"
              - "http://localhost:8083"
              - "http://localhost:8084"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      # ──────────────────────────────────────────────────────────────────────
      # Default Filters applied to ALL routes
      # ──────────────────────────────────────────────────────────────────────
      # AddResponseHeader: adds a header so the client can see which service
      # handled the request (useful for debugging and demonstration).
      # ──────────────────────────────────────────────────────────────────────
      default-filters:
        - AddResponseHeader=X-Gateway, RideLink-API-Gateway


# ==============================================================================
# Actuator Configuration
# ==============================================================================
# Exposes health, info, and gateway-specific endpoints.
#
# KEY ENDPOINTS:
#   GET http://localhost:8080/actuator/health          → gateway health
#   GET http://localhost:8080/actuator/info            → application info
#   GET http://localhost:8080/actuator/gateway/routes  → all configured routes
# ==============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      # show-details: always means health response shows full detail including
      # individual component status (useful for viva demonstration)
      show-details: always
    gateway:
      enabled: true


# ==============================================================================
# Application Info (displayed at /actuator/info)
# ==============================================================================
info:
  app:
    name: RideLink API Gateway
    description: Routes HTTP traffic to the four RideLink microservices
    version: 1.0.0
    port: 8080
  services:
    account-service: "http://localhost:8081  (routes: /api/auth/**, /api/users/**)"
    driver-service:  "http://localhost:8082  (routes: /api/drivers/**)"
    ride-service:    "http://localhost:8083  (routes: /api/rides/**)"
    fare-payment-service: "http://localhost:8084  (routes: /api/fares/**, /api/payments/**)"


# ==============================================================================
# Logging
# ==============================================================================
# Shows which routes matched and which services received requests.
# Set to DEBUG in development so you can see the full routing decision.
# Change to INFO in production.
# ==============================================================================
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG
    com.ridelink.gateway: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
